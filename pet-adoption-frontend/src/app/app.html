<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <h1>{{ title }}</h1>
      <p>Encuentra tu companero ideal, apoya refugios y gestiona adopciones.</p>
    </div>
    @if (session) {
      <div class="session-box">
        <span>{{ sessionLabel }}</span>
        <small>{{ sessionDetail }}</small>
        <button class="login-btn" type="button" (click)="logout()">Cerrar sesion</button>
      </div>
    } @else {
      <a class="login-btn" routerLink="/auth">{{ sessionLabel }}</a>
    }
  </header>

  <nav class="main-nav">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" [routerLinkActiveOptions]="{ exact: item.path === '/' }" routerLinkActive="active">
        {{ item.label }}
      </a>
    }
  </nav>

  <main class="content">
    <div
      class="content-inner"
      [@routeFade]="routeKey"
    >
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
