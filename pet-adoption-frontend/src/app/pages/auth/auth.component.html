<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <h2>@if (mode === 'login') { Iniciar sesion } @else { Crear cuenta }</h2>
      <p>Conectado al backend local en http://localhost:3000/api.</p>
    </div>

    <div class="tabs">
      <button type="button" [class.active]="mode === 'login'" (click)="mode = 'login'">Login</button>
      <button type="button" [class.active]="mode === 'register'" (click)="mode = 'register'">Registro</button>
    </div>

    @if (mode === 'register') {
      <form (ngSubmit)="register()">
        <label>
          Nombre completo
          <input [(ngModel)]="fullName" name="fullName" type="text" placeholder="Tu nombre" required />
        </label>

        <label>
          Correo
          <input [(ngModel)]="email" name="email" type="email" placeholder="usuario@correo.com" required />
        </label>

        <label>
          Contrasena
          <input [(ngModel)]="password" name="password" type="password" placeholder="********" required />
        </label>

        <label>
          Telefono
          <input [(ngModel)]="phone" name="phone" type="tel" placeholder="77711122" required />
        </label>

        <label>
          Fecha de nacimiento
          <input [(ngModel)]="birthDate" name="birthDate" type="date" required />
        </label>

        <button type="submit" class="primary" [disabled]="loading">@if (loading) { Creando... } @else { Crear cuenta }</button>
      </form>
    } @else {
      <form (ngSubmit)="login()">
        <label>
          Correo
          <input [(ngModel)]="email" name="email" type="email" placeholder="usuario@correo.com" required />
        </label>

        <label>
          Contrasena
          <input [(ngModel)]="password" name="password" type="password" placeholder="********" required />
        </label>

        <button type="submit" class="primary" [disabled]="loading">@if (loading) { Ingresando... } @else { Ingresar }</button>
      </form>
    }

    @if (message) {
      <p class="msg">{{ message }}</p>
    }
  </div>
</section>
